function mescola(a, seme) {
  var r = seme;
  function rnd() { r = (r * 9301 + 49297) % 233280; return r / 233280; }
  a = a.slice();
  for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(rnd() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
  return a;
}
function norm(s) {
  return String(s || '').toLowerCase()

    .replace(/\s+/g, '')

    .replace(/,/g, '.')
    .replace(/\.0+$/, '');
}

/* le risposte si ricalcolano sempre da S.scelte: cambiare una risposta vecchia non lascia
   tag o punti doppi */
function deriva() {
  S.tag = []; S.pil = {O: 0, Ca: 0, R: 0}; S.risposte = {}; S.k1 = null; S.k3 = null;
  PASSI.forEach(function (p, idx) {
    var i = S.scelte[idx];
    if (i == null || !p.q || !p.q.o) return;
    if (Array.isArray(i)) {
      if (!i.length) return;
      var sel = i.map(function (j) { return p.q.o[j]; });
      S.risposte[p.q.id] = sel.map(function (o) { return o.t; }).join(' · ');
      var buono = sel.some(function (o) { return o.buono; });
      ['O', 'Ca', 'R'].forEach(function (k) {
        var v = Math.max.apply(null, sel.map(function (o) { return o.p[k] || 0; }));
        S.pil[k] += buono ? Math.max(0, v - 1) : v;
      });
      return;
    }
    var o = p.q.o[i];
    S.risposte[p.q.id] = o.t;
    if (p.tipo === 'scelta') S.tag = S.tag.concat(o.tag);
    if (p.tipo === 'specchio') Object.keys(o.p).forEach(function (k) { S.pil[k] += o.p[k]; });
    if (p.tipo === 'k1') S.k1 = o.v;
    if (p.tipo === 'k3') S.k3 = o.v;
  });
  if (massimo > PASSI.findIndex(function (p) { return p.tipo === 'voto'; })) S.risposte.S6 = S.voto;
  S.risposte.K2 = 'F ' + S.k2.Fisica + ' · C ' + S.k2.Chimica + ' · B ' + S.k2.Biologia;
}

function calcola() {
  deriva();
  if (S.consegnata) valuta();
  var R = {};
  /* profilo */
  function ha(t) { return S.tag.indexOf(t) >= 0; }
  R.profilo = ha('qf-ripetente') ? 1 : ha('qf-adulto') ? 2 : (ha('qf-lavoratore') || ha('qf-pendolare')) ? 3 : ha('qf-scuola-senza-basi') ? 4 : ha('qf-fermo') ? 5 : 6;
  /* prova */
  R.punti = 0; R.mat = {Fisica: 0, Biologia: 0, Chimica: 0}; R.facileSbagliata = null;
  PROVA.forEach(function (q) {
    var r = S.prova[q.id];
    if (r && r.ok) { R.punti += q.pt; R.mat[q.mat] += q.pt; }
    else if (q.pt === 1 && !R.facileSbagliata) R.facileSbagliata = q;
  });
  R.prova10 = Math.round(R.punti / 18 * 10);
  R.errore = null;
  for (var lv = 1; lv <= 3 && !R.errore; lv++) PROVA.forEach(function (q) {
    if (!R.errore && q.pt === lv && !(S.prova[q.id] && S.prova[q.id].ok)) R.errore = q;
  });
  /* pilastro: parità → ricordare, capire, organizzarsi */
  var ord = [['ricordare', S.pil.R], ['capire', S.pil.Ca], ['organizzarsi', S.pil.O]];
  var best = ord[0];
  ord.forEach(function (x) { if (x[1] > best[1]) best = x; });
  R.pilastro = best[1] > 0 ? best[0] : (R.punti < 10 ? 'capire' : 'solido');
  /* conti */
  var fatti = 0;
  Object.keys(UD).forEach(function (m) { for (var i = 0; i < S.k2[m]; i++) fatti += UD[m].cfu[i]; });
  R.cfuFatti = fatti;
  R.cfuMancanti = 18 - fatti;
  R.oreNec = R.cfuMancanti * ORE_PER_CFU;
  R.sett = settimane();
  R.oreDisp = (S.k3 || 0) * R.sett;
  var q = R.oreNec > 0 ? Math.min(1, R.oreDisp / R.oreNec) : 1;
  R.copertura = Math.round((fatti + R.cfuMancanti * q) / 18 * 100);
  R.orePiu = Math.max(0, (R.oreNec - R.oreDisp) / R.sett);
  R.oreAvanzo = Math.max(0, R.oreDisp - R.oreNec);
  /* urgenza */
  if (R.copertura < 70 || R.punti < 9 || R.facileSbagliata) R.urgenza = 'alta';
  else if (R.copertura >= 100 && R.oreDisp >= R.oreNec && R.punti >= 14) R.urgenza = 'bassa';
  else R.urgenza = 'media';
  return R;
}

  if (R.facileSbagliata) bv.appendChild(el('p', {class: 'nota', text: 'Hai sbagliato la domanda facile di ' + R.facileSbagliata.mat.toLowerCase() + '. Le estreme le sbagliano quasi tutti, le facili no: è lì che si perdono i punti che poi mancano in graduatoria.'}));

  if (R.errore) {

    var giusta = q.t === 'm' ? q.o.filter(function (o) { return o.ok; })[0].t : q.giusta;
    var tua = r.scaduto ? 'Nessuna risposta' : (r.risposta ? 'Hai risposto ' + r.risposta + (q.unita && q.t === 'c' ? ' ' + q.unita : '') : 'Risposta vuota');
    bb.appendChild(el('div', {class: 'errore'}, [

  var fluidiKo = PROVA.some(function (q) { return (q.id === 'F2' || q.id === 'F3') && !(S.prova[q.id] && S.prova[q.id].ok); });
  var VIDEO_PILASTRO = {

    capire: {id: '7Ongc2Jbyz8', img: 'perche-non-riesci', tit: 'Il tuo buco è il capire: guarda questo video', txt: '«Perché non riesci a studiare e come fare per studiare meglio». Gratis, su YouTube.'},
    solido: {id: 'HNIIQG8_slY', img: 'corso-fallito-matteo', tit: 'Un video per te', txt: '«Da Corso Fallito a Campione di Memoria», live con Matteo Piazzo (24 minuti). Gratis, su YouTube.'}
  };
  var vd = fluidiKo
    ? {id: 'HjJ4nc8OHg0', img: 'fluidi-idrodinamica', tit: 'Hai sbagliato una domanda sui fluidi', txt: 'Sul nostro canale c\'è la lezione live «Idrodinamica: Bernoulli, Poiseuille e Laplace» (1 ora e 29). Gratis, su YouTube.'}
    : VIDEO_PILASTRO[R.pilastro];

    el('div', null, [el('b', {text: vd.tit}), el('span', {text: vd.txt})])
  ]));
  blocchi.push(bb);

  /* rivedi gli errori: tutte e nove le domande in un mazzo da scorrere, solo i fronti */
  var sbagliate = PROVA.filter(function (q) { return !(S.prova[q.id] && S.prova[q.id].ok); });
  if (true) {
    var carte = PROVA.map(function (q) {

        el('p', {class: 'q', text: q.q + (q.seq ? ' ' + q.seq : '') + (q.pre ? ' ' + q.pre + ' …' : '')}),

        el('p', {class: 'x', text: q.x}),
        el('p', {class: 'perche', text: r.e || ''})
      ]);
    });
    var mazzo = el('div', {class: 'mazzo', tabindex: '0', 'aria-label': 'Carte degli errori, scorri di lato'}, carte);
    var conta = el('span', {class: 'conta'});

    var dopo = el('button', {type: 'button', 'aria-label': 'Carta successiva', text: '›', onclick: function () { vaiCarta(attuale() + 1); }});
    function attuale() {
      var c = mazzo.scrollLeft + mazzo.clientWidth / 2, best = 0, dist = Infinity;
      carte.forEach(function (k, i) { var m = k.offsetLeft + k.offsetWidth / 2, d = Math.abs(m - c); if (d < dist) { dist = d; best = i; } });
      return best;

  /* cosa facciamo noi */
  /* il tono dell'invito dipende dal punteggio della prova (su 18): da drastico a accondiscendente */

  schermo(blocchi, 1);
